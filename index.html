<style>
:root{--bg:#fff4d6;--card:#fff;--ink:#3a2a4d;--pink:#ff8db5;--yel:#ffd23f;--grn:#5ed16a;--blu:#6ec6ff;--sub:#6b5a7e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2140;--card:#3a2f55;--ink:#fff4d6;--sub:#cdbfe6}}
:root[data-theme="dark"]{--bg:#2a2140;--card:#3a2f55;--ink:#fff4d6;--sub:#cdbfe6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;font-size:17px;line-height:1.6;background-image:radial-gradient(var(--pink) 2px,transparent 2px);background-size:34px 34px;background-position:0 0}
body::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.88;z-index:-1}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;background:var(--yel);border-bottom:4px solid var(--ink)}
nav a{color:#3a2a4d;text-decoration:none;font-weight:700;padding:6px 14px;border:3px solid #3a2a4d;border-radius:99px;background:#fff;box-shadow:0 3px 0 #3a2a4d;transition:.15s}
nav a.on,nav a:hover{background:var(--pink);transform:translateY(-2px)}
main{max-width:900px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);padding:20px;margin:22px 0}
h1,h2,h3{line-height:1.2;margin:.2em 0 .4em}
h1{font-size:2.3rem}h2{font-size:1.6rem}
.hero{text-align:center;background:var(--blu);color:#3a2a4d;position:relative;overflow:hidden}
.avatar{width:130px;height:130px;margin:0 auto 10px;border-radius:50%;background:var(--yel);border:5px solid #3a2a4d;display:grid;place-items:center;font-size:4.5rem;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
.tag{display:inline-block;background:#fff;border:3px solid #3a2a4d;border-radius:99px;padding:2px 14px;font-weight:700;margin:3px;color:#3a2a4d}
.float{position:absolute;font-size:2rem;animation:bob 3s ease-in-out infinite}
.btn{display:inline-block;font:inherit;font-weight:700;font-size:1.1rem;color:#3a2a4d;background:var(--grn);border:4px solid #3a2a4d;border-radius:99px;padding:10px 24px;box-shadow:0 5px 0 #3a2a4d;text-decoration:none;cursor:pointer;transition:.12s;margin:6px 4px}
.btn:hover{transform:translateY(-2px) rotate(-1deg)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3a2a4d}
.btn.alt{background:var(--yel)}.btn.pk{background:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.mini{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--ink)}
.gcard{text-align:center}
.thumb{height:130px;border-radius:16px;border:3px solid var(--ink);display:grid;place-items:center;font-size:4rem;margin-bottom:10px;color:#3a2a4d}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats div{background:#fff;border:3px solid #3a2a4d;border-radius:16px;padding:8px;font-weight:700}
.stats b{display:block;font-size:1.6rem}
.sub{color:var(--sub)}
.tl{border-left:5px dashed var(--pink);padding-left:16px;margin-left:8px}
.tl p{position:relative;margin:0 0 14px}.tl p::before{content:"⭐";position:absolute;left:-34px;top:0}
.banner{border-radius:20px;border:4px solid var(--ink);padding:26px 14px;text-align:center;color:#3a2a4d}
.banner .big{font-size:5rem;animation:bob 2.4s ease-in-out infinite}
.steps{counter-reset:s;padding:0;list-style:none}
.steps li{counter-increment:s;padding:6px 0 6px 46px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:34px;height:34px;border-radius:50%;background:var(--yel);color:#3a2a4d;border:3px solid var(--ink);display:grid;place-items:center;font-weight:700}
.pager{display:flex;justify-content:space-between;flex-wrap:wrap}
.logo{width:38px;height:38px;vertical-align:middle;margin-right:2px;animation:bob 2.5s ease-in-out infinite}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;color:#3a2a4d}
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.ct a{display:flex;align-items:center;gap:12px;text-decoration:none;color:#3a2a4d;font-weight:700;border:4px solid #3a2a4d;border-radius:20px;padding:12px 14px;box-shadow:0 5px 0 #3a2a4d;transition:.12s;word-break:break-all}
.ct a:hover{transform:translateY(-3px) rotate(-1deg)}.ct a:active{transform:translateY(4px);box-shadow:0 1px 0 #3a2a4d}
.ct i{font-style:normal;font-size:2rem}.ct small{display:block;font-weight:500;opacity:.8}
footer{text-align:center;padding:20px;color:var(--sub);font-weight:500}
</style>
</head>

<script>
// ===== THÊM GAME MỚI: chỉ cần thêm 1 object vào mảng này =====
const GAMES=[
{id:'pho',name:'Phở Hà Lội',emoji:'🍜',color:'#ff8db5',url:'https://phohaloi.vercel.app/',
 tag:'Game mô phỏng điều hành quán phở',
 short:'Mở quán phở, nấu từng tô thơm lừng, phục vụ khách và phát triển cơ ngơi.',
 intro:['Phở Hà Lội là game mô phỏng kinh doanh quán phở với phong cách hoạt hình dễ thương. Bạn sẽ bắt đầu từ một quán phở nhỏ, tự tay chuẩn bị từng tô phở nóng hổi và phục vụ những vị khách đủ kiểu tính cách.','Càng phục vụ tốt, quán càng đông: kiếm tiền, nâng cấp dụng cụ, mở rộng không gian và biến quán nhỏ thành thương hiệu phở được cả phố yêu thích. Game có nhạc nền vui tai, màn hình chào "Bắt đầu / Tiếp tục" và tự động lưu tiến trình.'],
 feats:[['🍲','Nấu phở','Chuẩn bị tô phở theo yêu cầu của từng khách.'],['🧑‍🍳','Phục vụ khách','Khách đến liên tục, phục vụ nhanh để nhận tiền và tip.'],['⬆️','Nâng cấp quán','Dùng tiền lãi để cải thiện quán và mở rộng.'],['🎵','Nhạc nền vui nhộn','Âm nhạc và hình ảnh tươi sáng, dễ thương.'],['💾','Lưu tiến trình','Thoát ra vào lại vẫn chơi tiếp được.'],['📱','Chơi trên điện thoại','Giao diện toàn màn hình, tối ưu cho cảm ứng.']],
 how:['Bấm "Bắt đầu" hoặc "Tiếp tục" ở trang chủ game.','Nhận đơn của khách và chuẩn bị đúng món.','Phục vụ nhanh để khách hài lòng, nhận tiền.','Dùng tiền nâng cấp quán và chinh phục mốc mới.']},
{id:'buffet',name:'Tiệm Buffet Nhỏ',emoji:'🍲',color:'#ffd23f',url:'https://tiembuffet.vercel.app/',
 tag:'Game quản lý tiệm buffet đáng yêu',
 short:'Mở cửa tiệm buffet nhỏ, bày món, đón khách và làm tiệm ngày càng đông vui.',
 intro:['Tiệm Buffet Nhỏ đưa bạn vào vai chủ một tiệm buffet xinh xắn. Nhiệm vụ của bạn là chuẩn bị đầy đủ các món ngon, giữ cho quầy buffet luôn đầy và chăm sóc từng vị khách ghé tiệm.','Khách ăn no nê, vui vẻ thì tiệm sẽ ngày một nổi tiếng. Hãy khéo léo quản lý món ăn, tiền bạc và phát triển tiệm nhỏ thành điểm hẹn ẩm thực được yêu thích với phong cách đồ hoạ hồng pastel ngọt ngào.'],
 feats:[['🍱','Quầy buffet','Bày biện và giữ quầy luôn đầy món ngon.'],['🙋','Đón khách','Khách vào ra liên tục, mỗi người một sở thích.'],['💰','Quản lý thu chi','Tính toán để tiệm có lãi và phát triển.'],['🎀','Đồ hoạ ngọt ngào','Màu hồng pastel, dễ thương, dễ chơi.'],['📱','Chơi mọi nơi','Mở bằng trình duyệt, không cần cài đặt.'],['🆓','Chơi miễn phí','Bấm vào là chơi ngay.']],
 how:['Bấm "Chơi ngay" và chờ tiệm chuẩn bị mở cửa.','Chuẩn bị món cho quầy buffet.','Đón khách và giữ cho mọi người hài lòng.','Thu tiền, nâng cấp và mở rộng tiệm.']},
{id:'rau',name:'Sạp Rau Ngoài Chợ',emoji:'🥬',color:'#5ed16a',url:'https://sapbanrau.vercel.app/',
 tag:'Game bán rau – Tiệm Rau Sạch',
 short:'Nhập rau, trồng rau, thuê nhân viên và biến sạp nhỏ thành tiệm rau sạch nổi tiếng.',
 intro:['Sạp Rau Ngoài Chợ là game mô phỏng bán rau với khẩu hiệu "Tươi Ngon – An Toàn – Không Hóa Chất". Bạn điều hành Tiệm Rau Sạch từ một sạp nhỏ ngoài chợ: nhập rau, bày hàng, đón khách và theo dõi doanh thu mỗi ngày.','Game có rất nhiều hệ thống để khám phá: nông trại tự trồng rau, tuyển nhân viên, chỉnh thực đơn, nâng cấp cửa hàng và trang trí sạp thật xinh. Ngoài ra còn nhiệm vụ, quà tặng, sự kiện và điểm danh đăng nhập mỗi ngày để bạn luôn có lý do quay lại.'],
 feats:[['🧺','Bán rau','Bắt đầu phiên chợ, phục vụ khách và xem doanh thu hôm nay.'],['🌱','Nông trại','Tự trồng rau để có nguồn hàng tươi.'],['📦','Nhập rau','Nhập thêm hàng khi kho sắp hết.'],['👥','Nhân viên','Thuê thêm người phụ giúp sạp.'],['📋','Thực đơn & Nâng cấp','Chọn mặt hàng bán và nâng cấp cửa hàng.'],['🏮','Trang trí','Làm đẹp sạp theo gu của bạn.'],['🧾','Nhiệm vụ & Sự kiện','Làm nhiệm vụ, nhận quà, tham gia sự kiện.'],['📅','Đăng nhập hằng ngày','Điểm danh nhận thưởng mỗi ngày.']],
 how:['Bấm "Bắt đầu bán rau" để mở phiên chợ.','Nhập rau hoặc trồng ở nông trại để có hàng.','Phục vụ khách, kiếm tiền và thuê nhân viên.','Nâng cấp, trang trí và làm nhiệm vụ nhận quà.']},
{id:'che',name:'Huế Chè',emoji:'🍧',color:'#f08a24',url:'https://tiemchehue.vercel.app/',
 tag:'Game mô phỏng quầy chè Huế',
 short:'Mở quầy chè Huế, pha từng ly chè đủ topping, giao hàng bằng flycam và phát triển quán.',
 intro:['Huế Chè là game mô phỏng kinh doanh quầy chè Huế với phong cách hoạt hình dễ thương. Bạn đặt tên cho quán, đứng quầy pha từng ly chè theo đúng yêu cầu của khách: chọn size ly, topping, nước, siro và đá.','Càng làm tốt, quán càng nổi tiếng: kiếm tiền, nhập nguyên liệu về kho, nâng cấp quầy, thuê nhân viên và mở khóa dần nhiều món mới. Có cả flycam giao chè tận nơi cho khách ở xa, đánh giá của khách và tự động lưu tiến trình.'],
 feats:[['🥤','Pha chè','Pha đúng size ly, topping, nước, siro và đá theo yêu cầu.'],['🧑‍🤝‍🧑','Phục vụ khách','Khách xếp hàng gọi món, phục vụ nhanh trước khi hết kiên nhẫn.'],['📦','Nhập hàng & kho','Mua nguyên liệu về kho, làm ly nào trừ kho ly đó.'],['🚁','Flycam giao hàng','Ly giao xa được flycam chở đi, lên giá theo km.'],['⭐','Đánh giá & tin nhắn','Đọc đánh giá của khách và nhắn tin trả lời.'],['🎨','Đổi màu giao diện','Chọn màu giao diện theo gu của bạn.'],['🔓','Mở khóa dần','Càng chơi lâu càng có nhiều món và tính năng mới.'],['💾','Lưu tiến trình','Thoát ra vào lại vẫn chơi tiếp được.']],
 how:['Đặt tên cho quán và bấm bắt đầu.','Đọc kỹ đơn của khách rồi pha đúng ly chè.','Phục vụ nhanh để khách hài lòng, nhận tiền.','Nhập hàng, nâng cấp quán và mở khóa món mới.']},
{id:'doanvat',name:'Đồ Ăn Vặt',emoji:'🌭',color:'#ff6b6b',url:'https://doanvat.vercel.app/',
 tag:'Game xe bán hàng vặt vỉa hè',
 short:'Mở xe bán đồ ăn vặt vỉa hè, chế biến món, phục vụ khách và phát triển quán ăn vặt.',
 intro:['Đồ Ăn Vặt là game mô phỏng xe bán hàng vặt vỉa hè với phong cách hoạt hình dễ thương. Bạn đứng xe bán đủ loại đồ ăn vặt: trà đào, trà tắc, matcha, cacao đá, bánh tráng, xúc xích, cá viên chiên, phô mai que, khoai chiên, takoyaki và nhiều món khác.','Game có thời tiết 4 mùa, lưu tiến trình tự động, hệ thống kho nguyên liệu, dụng cụ nấu nướng (lò vi sóng, nồi luộc trứng, bếp gas) và cả đầu máy nhạc để bật nhạc cho khách nghe. Càng phục vụ tốt, quán càng đông và phát triển.'],
 feats:[['🛒','Xe bán hàng vặt','Mở cửa quán, phục vụ khách vỉa hè Hà Nội.'],['🍹','Nhiều món ăn vặt','Trà, đồ chiên, trứng, topping và nước sốt đa dạng.'],['🌡️','Thời tiết 4 mùa','Trải nghiệm ngày nắng, mưa, lạnh theo mùa.'],['📦','Quản lý kho','Nhập ly, đĩa, nguyên liệu và theo dõi tồn kho.'],['🍳','Dụng cụ nấu','Lò vi sóng, nồi luộc trứng, bếp gas, tủ đông.'],['🎵','Đầu máy nhạc','Bật nhạc nền vui cho khách nghe khi chờ.'],['💾','Lưu tự động','Tiến trình được lưu, vào lại chơi tiếp được.'],['📱','Chơi trên điện thoại','Giao diện tối ưu cảm ứng, chơi ngay trên web.']],
 how:['Bấm "Chơi mới" hoặc "Tiếp tục" ở màn hình chính.','Mở cửa quán và chuẩn bị món theo đơn khách.','Phục vụ nhanh, giữ kho đầy đủ nguyên liệu.','Kiếm tiền, nâng cấp và phát triển xe bán hàng vặt.']}
];
const $=s=>document.querySelector(s);
const LOGO=`<img class="logo" alt="logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='16' fill='%23ff8db5' stroke='%233a2a4d' stroke-width='4'/%3E%3Cpath d='M16 24h32a8 8 0 0 1 8 8v8a6 6 0 0 1-10 4l-4-4H22l-4 4a6 6 0 0 1-10-4v-8a8 8 0 0 1 8-8z' fill='%23ffd23f' stroke='%233a2a4d' stroke-width='3'/%3E%3Crect x='15' y='30' width='12' height='4' fill='%233a2a4d'/%3E%3Crect x='19' y='26' width='4' height='12' fill='%233a2a4d'/%3E%3Ccircle cx='41' cy='30' r='3' fill='%233a2a4d'/%3E%3Ccircle cx='47' cy='36' r='3' fill='%233a2a4d'/%3E%3C/svg%3E">`;
const LINKS=[['#/','🏠 Trang chủ'],['#/games','🎮 Game'],['#/contact','📞 Liên hệ']];
function nav(h){$('#nav').innerHTML=`<span class="brand">${LOGO}</span>`+LINKS.map(l=>`<a href="${l[0]}" class="${h===l[0]||(l[0]==='#/games'&&h.startsWith('#/game'))?'on':''}">${l[1]}</a>`).join('')}
function contact(){return `<section class="card"><h2>📞 Liên hệ &amp; góp ý</h2><p class="sub">Có câu hỏi, muốn hợp tác hay góp ý cho game? Nhắn mình bất cứ lúc nào nhé!</p><div class="ct">

function home(){return `
<section class="card hero"><span class="float" style="left:6%;top:12%">🎮</span><span class="float" style="right:7%;top:10%;animation-delay:.6s">⭐</span><span class="float" style="left:10%;bottom:10%;animation-delay:1s">🍜</span><span class="float" style="right:10%;bottom:12%;animation-delay:1.4s">🥬</span>
<div class="avatar">🧑‍💻</div><h1>Xin chào, mình là Kiên Vũ!</h1><p style="font-weight:700">.game khởi nghiệp by Kiên Vũ</p>
<p><span class="tag">🎮 Game Developer</span><span class="tag">🏡 Hải Dương</span><span class="tag">🇻🇳 Made in Vietnam</span></p>
<p>Người đứng sau những tựa game mô phỏng kinh doanh dễ thương, chơi được ngay trên điện thoại.</p>
<a class="btn pk" href="#/games">Xem game của mình 🎮</a>
<div class="stats"><div><b>${GAMES.length}</b>Game</div><div><b>100%</b>Tự làm</div><div><b>∞</b>Ý tưởng</div></div></section>
<section class="card"><h2>👋 Giới thiệu</h2>
<p><b>Vũ Trung Kiên</b>, nghệ danh <b>Dev Kiên Vũ</b>, sinh ra và lớn lên ở <b>Hải Dương (cũ)</b> – mảnh đất nổi tiếng với bánh đậu xanh, vải thiều và những con người cần cù, chân chất.</p>
<p>Mình là một trong những lập trình viên game độc lập (indie) người Việt đam mê tạo ra những trò chơi nhẹ nhàng, gần gũi, mang đậm hơi thở đời sống: quán phở đầu ngõ, tiệm buffet nhỏ hay sạp rau ngoài chợ. Mỗi game đều do mình tự nghĩ ý tưởng, thiết kế giao diện, viết code và chăm chút từng chi tiết.</p>
<p>Mình tin rằng một game hay không cần quá phức tạp. Chỉ cần vui, dễ thương, mở lên là chơi được ngay, và mang đến cho người chơi vài phút thư giãn sau một ngày dài. 💖</p></section>
<section class="card"><h2>🛠️ Mình làm được gì?</h2>
<p><span class="tag" style="background:var(--pink)">Thiết kế ý tưởng game</span><span class="tag" style="background:var(--yel)">Lập trình HTML5 / JavaScript</span><span class="tag" style="background:var(--grn)">Thiết kế giao diện hoạt hình</span><span class="tag" style="background:var(--blu)">Tối ưu cho điện thoại</span><span class="tag" style="background:var(--pink)">Âm thanh &amp; nhạc nền</span><span class="tag" style="background:var(--yel)">Phát hành web (Vercel)</span></p></section>
<section class="card"><h2>🗺️ Hành trình</h2><div class="tl">
<p><b>Khởi đầu:</b> Từ niềm đam mê game, mình tự học lập trình và bắt tay làm những trò chơi đầu tiên.</p>
<p><b>Phở Hà Lội:</b> Game mô phỏng quán phở – tựa game đánh dấu bước tiến lớn, với mong muốn đưa lên cả cửa hàng ứng dụng.</p>
<p><b>Tiệm Buffet Nhỏ &amp; Sạp Rau:</b> Mở rộng sang những mô hình kinh doanh dễ thương khác.</p>
<p><b>Huế Chè:</b> Quầy chè Huế với đủ loại topping, siro và cả flycam giao hàng tận nơi.</p>
<p><b>Đồ Ăn Vặt:</b> Xe bán hàng vặt vỉa hè với thời tiết 4 mùa và đủ món ăn vặt.</p>
<p><b>Tiếp theo:</b> Còn rất nhiều game mới đang được "nấu" – cứ theo dõi nhé! 🍳</p></div></section>
<section class="card"><h2>🔥 Game nổi bật</h2><div class="grid">${GAMES.map(gameCard).join('')}</div></section>
<section class="card" style="background:var(--yel);color:#3a2a4d;text-align:center"><h2>💌 Cùng chơi nhé!</h2><p>Nếu thấy game vui, hãy chia sẻ cho bạn bè và gia đình. Mỗi lượt chơi của bạn là động lực rất lớn để mình làm thêm game mới!</p></section>${contact()}`}
function games(){return `<section class="card hero"><h1>🎮 Sản phẩm game</h1><p>Chọn một game để xem chi tiết hoặc chơi ngay. Sẽ còn cập nhật thêm game mới!</p></section>
<div class="grid">${GAMES.map(gameCard).join('')}<div class="mini gcard" style="border-style:dashed"><div class="thumb" style="background:var(--card)">🍳</div><h3>Đang nấu thêm...</h3><p class="sub">Game mới sắp ra mắt, đón chờ nhé!</p></div></div>`}
function game(id){const i=GAMES.findIndex(g=>g.id===id);if(i<0)return home();const g=GAMES[i],p=GAMES[(i+GAMES.length-1)%GAMES.length],n=GAMES[(i+1)%GAMES.length];
return `<section class="card"><div class="banner" style="background:${g.color}"><div class="big">${g.emoji}</div><h1>${g.name}</h1><span class="tag">${g.tag}</span></div>
<p style="text-align:center"><a class="btn" style="font-size:1.3rem" href="${g.url}" target="_blank" rel="noopener">▶ Truy cập ngay</a></p></section>
<section class="card"><h2>📖 Giới thiệu game</h2>${g.intro.map(t=>`<p>${t}</p>`).join('')}</section>
<section class="card"><h2>✨ Tính năng nổi bật</h2><div class="grid">${g.feats.map(f=>`<div class="mini"><div style="font-size:2rem">${f[0]}</div><b>${f[1]}</b><div class="sub">${f[2]}</div></div>`).join('')}</div></section>
<section class="card"><h2>🕹️ Cách chơi</h2><ol class="steps">${g.how.map(s=>`<li>${s}</li>`).join('')}</ol>
<p style="text-align:center"><a class="btn" href="${g.url}" target="_blank" rel="noopener">▶ Chơi ngay</a></p></section>
<div class="pager"><a class="btn alt" href="#/game/${p.id}">← ${p.name}</a><a class="btn alt" href="#/game/${n.id}">${n.name} →</a></div>`}
let cur=location.hash||'#/';
function route(){const h=cur;nav(h);const m=h.match(/^#\/game\/(.+)$/);
$('#app').innerHTML=m?game(m[1]):h==='#/games'?games():h==='#/contact'?contact():home();window.scrollTo(0,0)}
addEventListener('hashchange',()=>{const h=location.hash||'#/';if(h!==cur){cur=h;route()}});
document.addEventListener('click',e=>{
 const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
 const href=a.getAttribute('href');
 if(href.startsWith('#/')){e.preventDefault();cur=href;try{location.hash=href}catch(x){}route();return}
 if(a.target==='_blank'){e.preventDefault();let w=null;try{w=window.open(a.href,'_blank','noopener')}catch(x){}
  if(!w){try{window.top.location.href=a.href}catch(x){location.href=a.href}}}
});
route();
</script>
